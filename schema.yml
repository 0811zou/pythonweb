components:
  schemas:
    Order:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        buyer:
          type: integer
        total_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        status:
          $ref: '#/components/schemas/OrderStatusEnum'
        address:
          type: string
          maxLength: 300
        payment_proof:
          type: string
          maxLength: 500
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - address
      - buyer
      - created_at
      - id
      - items
    OrderItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        quantity:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        order:
          type: integer
          readOnly: true
        product_batch:
          type: integer
          nullable: true
      required:
      - id
      - order
      - price
    OrderStatusEnum:
      enum:
      - pending
      - paid_offline
      - confirmed
      - shipped
      - delivered
      - cancelled
      type: string
      description: |-
        * `pending` - pending
        * `paid_offline` - paid_offline
        * `confirmed` - confirmed
        * `shipped` - shipped
        * `delivered` - delivered
        * `cancelled` - cancelled
    PatchedOrder:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        buyer:
          type: integer
        total_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        status:
          $ref: '#/components/schemas/OrderStatusEnum'
        address:
          type: string
          maxLength: 300
        payment_proof:
          type: string
          maxLength: 500
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        created_at:
          type: string
          format: date-time
          readOnly: true
    PatchedProduct:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        category:
          type: string
          maxLength: 100
        variety:
          type: string
          maxLength: 100
        description:
          type: string
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        unit:
          type: string
          maxLength: 50
        created_at:
          type: string
          format: date-time
          readOnly: true
        farmer:
          type: integer
    PatchedProductBatch:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        product:
          allOf:
          - $ref: '#/components/schemas/Product'
          readOnly: true
        product_id:
          type: integer
          writeOnly: true
        batch_code:
          type: string
          maxLength: 100
        harvest_date:
          type: string
          format: date
          nullable: true
        quantity:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        images: {}
        trace_info: {}
        qc_report:
          type: string
          maxLength: 500
        created_at:
          type: string
          format: date-time
          readOnly: true
    PatchedSubsidyApplication:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        type:
          type: string
          maxLength: 100
        amount_requested:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        documents: {}
        status:
          $ref: '#/components/schemas/SubsidyApplicationStatusEnum'
        admin_notes:
          type: string
        submitted_at:
          type: string
          format: date-time
          readOnly: true
        decided_at:
          type: string
          format: date-time
          nullable: true
        farmer:
          type: integer
    PatchedTraining:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        content:
          type: string
        resource_url:
          type: string
          maxLength: 500
        created_at:
          type: string
          format: date-time
          readOnly: true
    Product:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        category:
          type: string
          maxLength: 100
        variety:
          type: string
          maxLength: 100
        description:
          type: string
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        unit:
          type: string
          maxLength: 50
        created_at:
          type: string
          format: date-time
          readOnly: true
        farmer:
          type: integer
      required:
      - created_at
      - farmer
      - id
      - name
      - price
    ProductBatch:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        product:
          allOf:
          - $ref: '#/components/schemas/Product'
          readOnly: true
        product_id:
          type: integer
          writeOnly: true
        batch_code:
          type: string
          maxLength: 100
        harvest_date:
          type: string
          format: date
          nullable: true
        quantity:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        images: {}
        trace_info: {}
        qc_report:
          type: string
          maxLength: 500
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - product
      - product_id
    SubsidyApplication:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        type:
          type: string
          maxLength: 100
        amount_requested:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        documents: {}
        status:
          $ref: '#/components/schemas/SubsidyApplicationStatusEnum'
        admin_notes:
          type: string
        submitted_at:
          type: string
          format: date-time
          readOnly: true
        decided_at:
          type: string
          format: date-time
          nullable: true
        farmer:
          type: integer
      required:
      - amount_requested
      - farmer
      - id
      - submitted_at
      - type
    SubsidyApplicationStatusEnum:
      enum:
      - submitted
      - approved
      - rejected
      type: string
      description: |-
        * `submitted` - submitted
        * `approved` - approved
        * `rejected` - rejected
    Training:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        content:
          type: string
        resource_url:
          type: string
          maxLength: 500
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - content
      - created_at
      - id
      - title
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
