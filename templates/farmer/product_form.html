{% extends 'base.html' %}
{% block title %}{{ action }}产品 - 智溯农链{% endblock %}
{% block content %}
<div class="container py-4" style="max-width: 640px;">
  <div class="card">
    <div class="card-header"><h5 class="mb-0"><i class="bi bi-{{ action|yesno:'plus-lg,pencil' }}"></i> {{ action }}产品</h5></div>
    <div class="card-body">
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">产品名称 <span class="text-danger">*</span></label>
          <input type="text" name="name" class="form-control" value="{{ product.name|default:'' }}" required>
        </div>
        <div class="row mb-3">
          <div class="col-md-4">
            <label class="form-label">分类</label>
            <input type="text" name="category" class="form-control" value="{{ product.category|default:'' }}" placeholder="如果蔬、粮油">
          </div>
          <div class="col-md-4">
            <label class="form-label">品种</label>
            <input type="text" name="variety" class="form-control" value="{{ product.variety|default:'' }}">
          </div>
          <div class="col-md-4">
            <label class="form-label">价格 <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text">¥</span>
              <input type="number" step="0.01" name="price" class="form-control" value="{{ product.price|default:'' }}" required>
              <input type="text" name="unit" class="form-control" value="{{ product.unit|default:'kg' }}" style="max-width:70px;">
            </div>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">产品图片</label>
          <input type="file" name="image" class="form-control" accept="image/*">
          {% if product.image %}
            <div class="mt-2">
              <img src="{{ product.image.url }}" style="max-height:120px;border-radius:8px;">
              <small class="text-muted d-block">当前图片</small>
            </div>
          {% endif %}
        </div>
        <div class="mb-3">
          <label class="form-label">描述</label>
          <textarea name="description" class="form-control" rows="3">{{ product.description|default:'' }}</textarea>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" name="submit" value="draft" class="btn btn-outline-secondary"><i class="bi bi-save"></i> 保存草稿</button>
          <button type="submit" name="submit" value="submit" class="btn btn-success"><i class="bi bi-send"></i> 提交审核</button>
          <a href="{% url 'farmer_dashboard' %}" class="btn btn-outline-danger ms-auto">取消</a>
        </div>
      </form>
      <div class="mt-3 p-3 bg-light rounded small">
        <strong>提示：</strong> 提交后产品将由管理员审核，审核通过后将在商城上架。
      </div>
    </div>
  </div>
</div>
{% endblock %}
