{% extends 'farmer/base.html' %}
{% block title %}填写快递单号 - 智农溯源{% endblock %}
{% block body %}
<div class="card" style="max-width:600px;">
  <div class="card-header bg-white"><h5 class="mb-0"><i class="bi bi-truck text-success"></i> 发货 - 订单 #{{ order.id }}</h5></div>
  <div class="card-body">
    <p class="text-muted">为订单 <strong>#{{ order.id }}</strong> 填写快递单号，标记为已发货。</p>
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">快递单号 <span class="text-danger">*</span></label>
        <input type="text" name="tracking_number" class="form-control" required placeholder="例如 SF1234567890">
      </div>
      <button type="submit" class="btn btn-success"><i class="bi bi-check-lg"></i> 确认发货</button>
      <a href="{% url 'trade:farmer_orders'  %}" class="btn btn-outline-secondary ms-2">取消</a>
    </form>
  </div>
</div>
{% endblock %}
