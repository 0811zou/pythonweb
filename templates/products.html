{% extends 'base.html' %}
{% load static %}

{% block title %}农产品列表 - 智溯农链{% endblock %}

{% block content %}
<section class="py-4" style="background: linear-gradient(135deg, #e8f5e9, #f1f8e9);">
  <div class="container">
    <h1 class="section-title mb-1">🌾 全部农产品</h1>
    <p class="text-muted">每一份产品都可追溯，买得放心吃得安心</p>
    <!-- 筛选区域 -->
    <div class="row mt-3 g-2">
      <div class="col-md-4">
        <input type="text" class="search-box" id="searchInput" placeholder="搜索产品名称或描述…" oninput="applyFilters()">
      </div>
      <div class="col-md-2">
        <select class="form-select" id="categoryFilter" onchange="onCategoryChange()">
          <option value="">全部分类</option>
        </select>
      </div>
      <div class="col-md-2">
        <select class="form-select" id="varietyFilter" onchange="applyFilters()" disabled>
          <option value="">全部品种</option>
        </select>
      </div>
      <div class="col-md-2">
        <select class="form-select" id="originFilter" onchange="applyFilters()">
          <option value="">全部产地</option>
        </select>
      </div>
      <div class="col-md-2">
        <button class="btn btn-outline-secondary w-100" onclick="resetFilters()"><i class="bi bi-x-circle"></i> 清空筛选</button>
      </div>
    </div>
  </div>
</section>

<section class="py-4">
  <div class="container">
    <div class="row g-4" id="product-grid">
      <div class="col-12 text-center py-5">
        <div class="loading-spinner">
          <div class="spinner-border text-success" role="status"><span class="visually-hidden">加载中…</span></div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}

{% block extra_scripts %}
<script>
let allProducts = [];
let filterOptions = { categories: [], varieties: {}, origins: [] };

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[ch]));
}

// 加载筛选选项
fetch('/api/products/filter-options/')
  .then(r => r.json())
  .then(opts => {
    filterOptions = opts;
    // 填充分类下拉
    const catSel = document.getElementById('categoryFilter');
    opts.categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c; opt.textContent = c;
      catSel.appendChild(opt);
    });
    // 填充产地下拉
    const originSel = document.getElementById('originFilter');
    // 去重
    const uniqueOrigins = [...new Set(opts.origins)];
    uniqueOrigins.forEach(o => {
      if (!o) return;
      const opt = document.createElement('option');
      opt.value = o; opt.textContent = o;
      originSel.appendChild(opt);
    });
  });

function onCategoryChange() {
  const cat = document.getElementById('categoryFilter').value;
  const varietySel = document.getElementById('varietyFilter');
  varietySel.innerHTML = '<option value="">全部品种</option>';
  if (cat && filterOptions.varieties[cat]) {
    filterOptions.varieties[cat].forEach(v => {
      const opt = document.createElement('option');
      opt.value = v; opt.textContent = v;
      varietySel.appendChild(opt);
    });
    varietySel.disabled = false;
  } else {
    varietySel.disabled = true;
  }
  applyFilters();
}

function resetFilters() {
  document.getElementById('searchInput').value = '';
  document.getElementById('categoryFilter').value = '';
  document.getElementById('varietyFilter').innerHTML = '<option value="">全部品种</option>';
  document.getElementById('varietyFilter').disabled = true;
  document.getElementById('originFilter').value = '';
  applyFilters();
}

function getFilters() {
  return {
    search: document.getElementById('searchInput').value,
    category: document.getElementById('categoryFilter').value,
    variety: document.getElementById('varietyFilter').value,
    origin: document.getElementById('originFilter').value,
  };
}

function applyFilters() {
  const f = getFilters();
  let url = '/api/products/';
  const params = [];
  if (f.search) params.push('search=' + encodeURIComponent(f.search));
  if (f.category) params.push('category=' + encodeURIComponent(f.category));
  if (f.variety) params.push('variety=' + encodeURIComponent(f.variety));
  if (f.origin) params.push('origin=' + encodeURIComponent(f.origin));
  if (params.length) url += '?' + params.join('&');

  const grid = document.getElementById('product-grid');
  grid.innerHTML = '<div class="col-12 text-center py-5"><div class="loading-spinner"><div class="spinner-border text-success" role="status"><span class="visually-hidden">加载中…</span></div></div></div>';

  fetch(url)
    .then(r => r.json())
    .then(data => {
      const list = Array.isArray(data) ? data : (data.results || []);
      renderProducts(list);
    })
    .catch(() => {
      grid.innerHTML = '<div class="col-12 text-center py-5 text-muted">加载失败，请刷新重试</div>';
    });
}

function renderProducts(list) {
  const grid = document.getElementById('product-grid');
  if (list.length === 0) {
    grid.innerHTML = '<div class="col-12 text-center py-5 text-muted"><i class="bi bi-inbox" style="font-size:3rem;display:block;margin-bottom:12px;"></i>暂无产品</div>';
    return;
  }
  grid.innerHTML = list.map(p => `
    <div class="col-lg-3 col-md-4 col-6">
      <div class="card h-100">
        ${p.image ? `
          <img src="${escapeHtml(p.image)}" class="card-img-top" style="height:180px;object-fit:cover;" alt="${escapeHtml(p.name)}">
        ` : `
          <div class="card-img-top d-flex align-items-center justify-content-center" style="height:180px;background:#e8f5e9;font-size:3rem;color:#2d8a4e;">
            <i class="bi bi-${p.category === '水果' ? 'apple' : p.category === '蔬菜' ? 'flower1' : p.category === '谷物' ? 'flower2' : 'basket'}"></i>
          </div>
        `}
        <div class="card-body d-flex flex-column">
          <span class="badge-trace mb-1" style="align-self:flex-start;">${escapeHtml(p.category || '农产品')}</span>
          <h5 class="card-title">${escapeHtml(p.name)}</h5>
          <p class="card-text small flex-grow-1">${escapeHtml(p.description ? p.description.substring(0,80) : '来自优质产地的健康农产品')}</p>
          <div class="d-flex justify-content-between align-items-center mt-auto">
            <span class="price">¥${Number.parseFloat(p.price).toFixed(2)} <small>/ ${escapeHtml(p.unit||'kg')}</small></span>
            <a href="/products/${p.id}/" class="btn btn-sm btn-outline-primary">详情 <i class="bi bi-arrow-right"></i></a>
          </div>
        </div>
      </div>
    </div>
  `).join('');
}

// 初始加载全部产品
applyFilters();
</script>
{% endblock %}
