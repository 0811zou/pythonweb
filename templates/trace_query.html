{% extends 'base.html' %}
{% load static %}

{% block title %}溯源查询 - 绿农溯源{% endblock %}

{% block content %}
<section class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="auth-card" style="max-width:100%;">
          <div class="text-center mb-3">
            <div style="font-size:3rem;color:var(--primary);"><i class="bi bi-qr-code-scan"></i></div>
          </div>
          <h2 class="text-center">溯源查询</h2>
          <p class="text-center text-muted mb-4">输入产品批次编号查询完整的溯源信息</p>
          <form method="get" action="/trace/">
            <div class="mb-3">
              <label class="form-label">批次编号</label>
              <input type="text" name="code" class="form-control" placeholder="例如：5f7e3a2b-..." value="{{ request.GET.code }}" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2"><i class="bi bi-search"></i> 查询溯源</button>
          </form>
          <hr class="my-4">
          <p class="small text-muted text-center mb-0">
            每个农产品外包装上都贴有溯源二维码<br>
            扫码即可查看完整溯源信息
          </p>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
